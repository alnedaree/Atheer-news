name: Build APK from ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unzip project
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No .zip file found in repository root!"
            exit 1
          fi
          echo "Found ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project_files

      - name: Build Debug APK
        run: |
          ANDROID_DIR=$(find project_files -name "settings.gradle.kts" -type f -exec dirname {} \; | head -n 1)
          if [ -z "$ANDROID_DIR" ]; then
            echo "Android project folder not found inside the ZIP!"
            exit 1
          fi
          echo "Building in: $ANDROID_DIR"
          cd "$ANDROID_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Atheer-News-APK
          path: project_files/**/app/build/outputs/apk/debug/*.apk
